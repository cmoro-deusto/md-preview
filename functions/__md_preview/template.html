<!DOCTYPE html>
<html lang="$if(lang)$$lang$$else$en$endif$">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$pagetitle$</title>
$for(css)$
  <link rel="stylesheet" href="$css$" />
$endfor$
  <style>
$if(highlighting-css)$
$highlighting-css$
$endif$

    :root {
      /* ---------- fonts ---------- */
      --font-sans: "SF Pro Display", "SF Pro Text", "SF Pro", system-ui, sans-serif,
                   "Apple Color Emoji", "Noto Color Emoji";
      --font-serif: "New York Small", "New York Medium", "New York", serif;
      --font-mono: "SF Mono", "SFMono Nerd Font", ui-monospace, monospace;

      /* ---------- base ---------- */
      --bg: #0d1117;
      --text: #cdd3dc;
      --text-strong: #eef1f5;
      --bold: #d8dde4;
      --muted: #858d99;
      --border: #2a3039;

      /* ---------- pastel palette ---------- */
      --p-blue: #9ccbf5;
      --p-lavender: #bfb1ef;
      --p-green: #a6d7a8;
      --p-peach: #f0bfa0;
      --p-yellow: #ecd496;
      --p-pink: #eeaab8;

      /* ---------- headings: warm pastel, light to dark ---------- */
      --h1: #c4ab82;
      --h2: #b69d76;
      --h3: #a8906b;
      --h4: #9a8361;
    }

    html, body { background-color: var(--bg); margin: 0; }

    .markdown-body {
      box-sizing: border-box;
      max-width: 1090px;
      margin: 0 auto;
      padding: 48px;
      font-family: var(--font-sans);
      font-size: 16.5px;
      line-height: 1.65;
      letter-spacing: 0.005em;
      color: var(--text);
    }
    @media (max-width: 767px) {
      .markdown-body { padding: 16px; }
    }

    .markdown-body code,
    .markdown-body kbd,
    .markdown-body pre,
    .markdown-body samp,
    .markdown-body tt {
      font-family: var(--font-mono);
    }

    .markdown-body ::selection { background: rgba(156, 203, 245, 0.3); }

    /* ---------- headings ---------- */
    .markdown-body h1, .markdown-body h2, .markdown-body h3,
    .markdown-body h4, .markdown-body h5, .markdown-body h6 {
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .markdown-body h1 { color: var(--h1); border-bottom: 1px solid var(--border); }
    .markdown-body h2 { color: var(--h2); border-bottom: 1px solid var(--border); }
    .markdown-body h3 { color: var(--h3); }
    .markdown-body h4 { color: var(--h4); }
    .markdown-body h5, .markdown-body h6 { color: var(--muted); }

    /* ---------- inline emphasis ---------- */
    .markdown-body strong { color: var(--bold); font-weight: 600; }
    .markdown-body em { color: var(--text-strong); }
    .markdown-body a { color: var(--p-blue); text-decoration-color: rgba(156, 203, 245, 0.35); }
    .markdown-body a:hover { text-decoration-color: currentColor; }
    .markdown-body mark {
      background: rgba(236, 212, 150, 0.22);
      color: var(--text-strong);
      padding: 0 0.2em;
      border-radius: 3px;
    }

    /* inline code (not inside code blocks) */
    .markdown-body :not(pre) > code {
      color: var(--text-strong);
      background: rgba(110, 118, 129, 0.08);
      border: 0;
      padding: 0.1em 0.35em;
      border-radius: 5px;
    }

    /* ---------- code blocks ---------- */
    .markdown-body div.sourceCode { background-color: transparent; margin: 0 0 16px; }
    .markdown-body pre {
      border: 1px solid var(--border);
      border-radius: 8px;
      line-height: 1.5;
    }
    .markdown-body pre > code.sourceCode > span { line-height: inherit; }

    /* ---------- lists ---------- */
    .markdown-body li::marker { color: var(--muted); }
    .markdown-body ul.task-list { list-style: none; padding-left: 0.5em; }
    .markdown-body input[type="checkbox"] { accent-color: var(--p-green); margin-right: 0.4em; }

    /* ---------- blockquotes (serif) ---------- */
    .markdown-body blockquote {
      font-family: var(--font-serif);
      font-size: 1.05em;
      color: var(--text);
      border-left: 3px solid var(--p-lavender);
      background: rgba(191, 177, 239, 0.05);
      padding: 0.6em 1em;
      border-radius: 0 6px 6px 0;
    }

    /* ---------- tables ---------- */
    .markdown-body table th {
      background: rgba(156, 203, 245, 0.07);
      color: var(--text-strong);
    }
    .markdown-body table tr:hover td { background: rgba(177, 186, 196, 0.06); }

    /* ---------- GitHub alerts: > [!NOTE] etc. ---------- */
    .markdown-body div.note, .markdown-body div.tip, .markdown-body div.important,
    .markdown-body div.warning, .markdown-body div.caution {
      --alert: var(--p-blue);
      border-left: 3px solid var(--alert);
      background: color-mix(in srgb, var(--alert) 7%, transparent);
      padding: 0.6em 1em;
      margin: 0 0 16px;
      border-radius: 0 6px 6px 0;
    }
    .markdown-body div.tip       { --alert: var(--p-green); }
    .markdown-body div.important { --alert: var(--p-lavender); }
    .markdown-body div.warning   { --alert: var(--p-yellow); }
    .markdown-body div.caution   { --alert: var(--p-pink); }
    .markdown-body div.note > .title p,
    .markdown-body div.tip > .title p,
    .markdown-body div.important > .title p,
    .markdown-body div.warning > .title p,
    .markdown-body div.caution > .title p {
      color: var(--alert);
      font-weight: 600;
      margin: 0 0 0.3em;
    }
    .markdown-body div.note > :last-child, .markdown-body div.tip > :last-child,
    .markdown-body div.important > :last-child, .markdown-body div.warning > :last-child,
    .markdown-body div.caution > :last-child { margin-bottom: 0; }

    /* ---------- misc ---------- */
    .markdown-body hr { background: linear-gradient(90deg, transparent, var(--border), transparent); }
    .markdown-body section.footnotes { color: var(--muted); font-size: 0.9em; }
    .markdown-body section.footnotes > hr { display: none; }

    /* ---------- outline sidebar ---------- */
    :root { --toc-w: 280px; }
    html { scroll-behavior: smooth; }
    .markdown-body :is(h1, h2, h3, h4, h5, h6) { scroll-margin-top: 24px; }

    /* no slide animation while the page sets its initial state */
    body.toc-init, body.toc-init #TOC { transition: none !important; }

    #TOC {
      position: fixed;
      top: 0; bottom: 0; left: 0;
      width: var(--toc-w);
      box-sizing: border-box;
      padding: 56px 16px 24px 12px;
      overflow-y: auto;
      background: #0a0d12;
      border-right: 1px solid var(--border);
      font-family: var(--font-sans);
      font-size: 13.5px;
      line-height: 1.45;
      transition: transform 0.2s ease;
      z-index: 10;
    }
    body.toc-hidden #TOC { transform: translateX(-100%); }
    #TOC .toc-label {
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 10px 10px;
    }
    #TOC ul { list-style: none; margin: 0; padding: 0; }
    #TOC ul ul { padding-left: 12px; }
    #TOC a {
      display: block;
      padding: 3px 8px;
      color: var(--muted);
      text-decoration: none;
      border-left: 2px solid transparent;
      border-radius: 0 4px 4px 0;
    }
    #TOC a:hover { color: var(--text-strong); background: rgba(110, 118, 129, 0.08); }
    #TOC a.active {
      color: var(--h1);
      border-left-color: var(--h1);
      background: rgba(196, 171, 130, 0.07);
    }

    #toc-toggle {
      position: fixed;
      top: 12px; left: 12px;
      z-index: 11;
      width: 32px; height: 32px;
      display: grid; place-items: center;
      padding: 0;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    #toc-toggle:hover { color: var(--text-strong); border-color: #3a414b; }

    /* narrow windows: outline covers the text, so give it a shadow */
    @media (max-width: 1100px) {
      body:not(.toc-hidden) #TOC { box-shadow: 8px 0 24px rgba(0, 0, 0, 0.5); }
    }
  </style>
$for(header-includes)$
  $header-includes$
$endfor$
</head>
<body$if(table-of-contents)$ class="has-toc toc-init"$endif$>
$if(table-of-contents)$
<button id="toc-toggle" type="button" aria-controls="TOC" aria-expanded="true" title="Toggle outline (t)">☰</button>
<nav id="TOC" role="doc-toc">
<div class="toc-label">Contents</div>
$table-of-contents$
</nav>
$endif$
<article class="markdown-body">
$body$
</article>
$if(table-of-contents)$
<script>
(() => {
  const body = document.body;
  const btn = document.getElementById('toc-toggle');
  const nav = document.getElementById('TOC');
  const KEY = 'md-toc-hidden';
  const narrow = window.matchMedia('(max-width: 1100px)');

  let stored = null;
  try { stored = localStorage.getItem(KEY); } catch (e) { /* storage unavailable */ }

  const setHidden = (hidden, save) => {
    body.classList.toggle('toc-hidden', hidden);
    btn.setAttribute('aria-expanded', String(!hidden));
    if (save) {
      try { localStorage.setItem(KEY, hidden ? '1' : '0'); } catch (e) { /* storage unavailable */ }
    }
  };

  setHidden(narrow.matches || stored === '1', false);
  requestAnimationFrame(() => requestAnimationFrame(() => body.classList.remove('toc-init')));
  btn.addEventListener('click', () => setHidden(!body.classList.contains('toc-hidden'), !narrow.matches));
  document.addEventListener('keydown', (e) => {
    if (e.key === 't' && !e.ctrlKey && !e.metaKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$$/.test(e.target.tagName)) {
      btn.click();
    }
  });

  const tocLinks = [...nav.querySelectorAll('a[href^="#"]')];
  tocLinks.forEach((a) => a.addEventListener('click', () => { if (narrow.matches) setHidden(true, false); }));

  // highlight the section currently being read
  const byId = new Map(tocLinks.map((a) => [decodeURIComponent(a.hash.slice(1)), a]));
  const headings = [...document.querySelectorAll('.markdown-body [id]')].filter((h) => byId.has(h.id));
  let current = null;
  const update = () => {
    let active = headings[0];
    for (const h of headings) {
      if (h.getBoundingClientRect().top <= 120) active = h; else break;
    }
    const link = active ? byId.get(active.id) : null;
    if (link === current) return;
    if (current) current.classList.remove('active');
    if (link) {
      link.classList.add('active');
      const top = link.offsetTop;
      if (top < nav.scrollTop + 40 || top > nav.scrollTop + nav.clientHeight - 40) {
        nav.scrollTop = top - nav.clientHeight / 2;
      }
    }
    current = link;
  };
  window.addEventListener('scroll', update, { passive: true });
  update();
})();
</script>
$endif$
</body>
</html>
